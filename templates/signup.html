{% extends "base.html" %}
{% block title %}Sign Up{% endblock %}
{% block content %}
  <div class="card">
    <h1>Create Account</h1>
    <form id="signup-form">
      <label>Username</label>
      <input type="text" id="username" placeholder="Username" required>

      <label>Email Address</label>
      <input type="email" id="email" placeholder="email@example.com" required>

      <label>Password</label>
      <input type="password" id="password" placeholder="Password (min 6 chars)" required>

      <button type="submit" id="submit-btn">Sign Up</button>
    </form>
    <p class="message" id="message"></p>
    <p class="switch">Already have an account? <a href="/signin">Sign in</a></p>
  </div>

  <script>
    document.getElementById("signup-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("message");
      const btn = document.getElementById("submit-btn");
      msg.textContent = "";
      btn.disabled = true;
      btn.textContent = "Signing up...";

      try {
        const body = {
          username: document.getElementById("username").value,
          email: document.getElementById("email").value,
          password: document.getElementById("password").value,
        };

        const res = await fetch("/api/auth/signup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await res.json();

        if (res.ok) {
          msg.className = "message success";
          msg.innerHTML = `Account created successfully! 🎉<br><br>
            A verification link has been sent to your Gmail address.<br>
            Please open your Gmail inbox and click the <strong>Verify Email</strong> link to activate your account.<br><br>
            <a href="/signin" style="color: #60a5fa; font-weight: 500;">Proceed to Sign In</a>`;

          if (data.verification_token) {
            msg.innerHTML += `<br><br><details style="font-size:0.8rem; color:#94a3b8;"><summary>Development Fallback Token</summary>
              <input type="text" id="signup-vtoken" value="${data.verification_token}" style="margin: 4px 0 8px;">
              <button type="button" id="signup-verify-btn" style="padding: 4px 8px; font-size:0.8rem;">Verify Now</button></details>`;

            setTimeout(() => {
              const vBtn = document.getElementById("signup-verify-btn");
              if (vBtn) {
                vBtn.addEventListener("click", async () => {
                  const vToken = document.getElementById("signup-vtoken").value.trim();
                  if (!vToken) return;
                  const vRes = await fetch("/api/auth/verify-email", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ verification_token: vToken }),
                  });
                  const vData = await vRes.json();
                  if (vRes.ok) {
                    localStorage.setItem("token", data.access_token || data.token);
                    if (data.refresh_token) {
                      localStorage.setItem("refresh_token", data.refresh_token);
                    }
                    window.location.href = "/profile";
                  } else {
                    alert(vData.error || "Verification failed");
                  }
                });
              }
            }, 100);
          }
        } else {
          msg.textContent = data.error || "Something went wrong";
        }

      } catch (err) {
        msg.textContent = "Connection error. Please ensure server is running.";
      } finally {
        btn.disabled = false;
        btn.textContent = "Sign Up";
      }
    });
  </script>
{% endblock %}
