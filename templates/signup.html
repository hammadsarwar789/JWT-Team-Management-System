{% extends "base.html" %}
{% block title %}Sign Up{% endblock %}
{% block content %}
  <div class="card">
    <h1>Create Account</h1>
    <form id="signup-form">
      <label>Username</label>
      <input type="text" id="username" placeholder="Username" required>

      <label>Email Address</label>
      <input type="email" id="email" placeholder="email@example.com" required>

      <label>Password</label>
      <input type="password" id="password" placeholder="Password (min 6 chars)" required>

      <button type="submit" id="submit-btn">Sign Up</button>
    </form>
    <p class="message" id="message"></p>
    <p class="switch">Already have an account? <a href="/signin">Sign in</a></p>
  </div>

  <script>
    document.getElementById("signup-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("message");
      const btn = document.getElementById("submit-btn");
      msg.textContent = "";
      btn.disabled = true;
      btn.textContent = "Signing up...";

      try {
        const body = {
          username: document.getElementById("username").value,
          email: document.getElementById("email").value,
          password: document.getElementById("password").value,
        };

        const res = await fetch("/api/auth/signup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await res.json();

        if (res.ok) {
          localStorage.setItem("token", data.access_token || data.token);
          if (data.refresh_token) {
            localStorage.setItem("refresh_token", data.refresh_token);
          }
          window.location.href = "/profile";
        } else {
          msg.textContent = data.error || "Something went wrong";
        }
      } catch (err) {
        msg.textContent = "Connection error. Please ensure 'py run.py' is running.";
      } finally {
        btn.disabled = false;
        btn.textContent = "Sign Up";
      }
    });
  </script>
{% endblock %}
