{% extends "base.html" %}
{% block title %}Sign Up{% endblock %}
{% block content %}
  <div class="card">
    <h1>Create Account</h1>
    <form id="signup-form">
      <label>Username</label>
      <input type="text" id="username" placeholder="Username" required>

      <label>Email Address</label>
      <input type="email" id="email" placeholder="email@example.com" required>

      <label>Password</label>
      <input type="password" id="password" placeholder="Password (min 6 chars)" required>

      <button type="submit" id="submit-btn">Sign Up</button>
    </form>
    <p class="message" id="message"></p>
    <p class="switch">Already have an account? <a href="/signin">Sign in</a></p>
  </div>

  <script>
    document.getElementById("signup-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("message");
      const btn = document.getElementById("submit-btn");
      msg.textContent = "";
      btn.disabled = true;
      btn.textContent = "Signing up...";

      try {
        const body = {
          username: document.getElementById("username").value,
          email: document.getElementById("email").value,
          password: document.getElementById("password").value,
        };

        const res = await fetch("/api/auth/signup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await res.json();

        if (res.ok) {
          msg.className = "message success";
          msg.innerHTML = `Account created! Verification email dispatched via Celery.<br><br>
            <label style="font-size:0.85rem;">Verification Token:</label>
            <input type="text" id="signup-vtoken" value="${data.verification_token || ''}" placeholder="Verification Token" style="margin: 4px 0 8px;">
            <button type="button" id="signup-verify-btn" style="padding: 6px 12px; font-size:0.85rem;">Verify Email & Sign In</button>`;

          document.getElementById("signup-verify-btn").addEventListener("click", async () => {
            const vToken = document.getElementById("signup-vtoken").value.trim();
            if (!vToken) return;
            const vRes = await fetch("/api/auth/verify-email", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ verification_token: vToken }),
            });
            const vData = await vRes.json();
            if (vRes.ok) {
              localStorage.setItem("token", data.access_token || data.token);
              if (data.refresh_token) {
                localStorage.setItem("refresh_token", data.refresh_token);
              }
              window.location.href = "/profile";
            } else {
              alert(vData.error || "Verification failed");
            }
          });
        } else {
          msg.textContent = data.error || "Something went wrong";
        }
      } catch (err) {
        msg.textContent = "Connection error. Please ensure server is running.";
      } finally {
        btn.disabled = false;
        btn.textContent = "Sign Up";
      }
    });
  </script>
{% endblock %}
