{% extends "base.html" %}
{% block title %}Verify Email{% endblock %}
{% block content %}
  <div class="card">
    <h1 id="verify-title">Email Verification</h1>
    <p class="message" id="verify-status" style="font-size: 1rem; margin: 16px 0;">Processing verification token...</p>

    <!-- Manual Token Entry fallback if link was copied without parameters -->
    <div id="manual-token-container" class="hidden" style="margin-top: 16px; padding-top: 16px; border-top: 1px solid #334155;">
      <p style="font-size:0.9rem; color:#94a3b8; margin-bottom: 12px;">If your email link didn't open automatically, paste your verification token below:</p>
      <form id="manual-token-form">
        <label>Verification Token</label>
        <input type="text" id="manual-token-input" placeholder="Paste verification token here" required>
        <button type="submit" id="manual-verify-btn">Verify Email</button>
      </form>
    </div>

    <p class="switch" style="margin-top: 20px;">
      <a href="/signin" id="signin-link">Go to Sign In</a>
    </p>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const statusEl = document.getElementById("verify-status");
      const titleEl = document.getElementById("verify-title");
      const manualContainer = document.getElementById("manual-token-container");

      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get("token") || urlParams.get("verification_token");

      if (!token) {
        statusEl.textContent = "No verification token found in URL.";
        statusEl.className = "message";
        manualContainer.classList.remove("hidden");
        return;
      }

      statusEl.textContent = "Verifying your email address with the server...";

      try {
        const res = await fetch("/api/auth/verify-email", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ verification_token: token.trim() })
        });
        const data = await res.json();

        if (res.ok) {
          titleEl.textContent = "Email Verified!";
          statusEl.className = "message success";
          statusEl.innerHTML = "Your email has been verified successfully!<br><br>You can now sign in to your account.";
        } else {
          titleEl.textContent = "Verification Failed";
          statusEl.className = "message";
          statusEl.textContent = data.error || "Verification token is invalid or expired.";
          manualContainer.classList.remove("hidden");
        }
      } catch (err) {
        statusEl.className = "message";
        statusEl.textContent = "Connection error. Please ensure the server is running.";
        manualContainer.classList.remove("hidden");
      }
    });

    document.getElementById("manual-token-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const tokenInput = document.getElementById("manual-token-input").value.trim();
      if (!tokenInput) return;

      const statusEl = document.getElementById("verify-status");
      const titleEl = document.getElementById("verify-title");
      const btn = document.getElementById("manual-verify-btn");

      btn.disabled = true;
      btn.textContent = "Verifying...";

      try {
        const res = await fetch("/api/auth/verify-email", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ verification_token: tokenInput })
        });
        const data = await res.json();

        if (res.ok) {
          titleEl.textContent = "Email Verified!";
          statusEl.className = "message success";
          statusEl.innerHTML = "Your email has been verified successfully!<br><br>You can now sign in to your account.";
          document.getElementById("manual-token-container").classList.add("hidden");
        } else {
          statusEl.className = "message";
          statusEl.textContent = data.error || "Verification token is invalid or expired.";
        }
      } catch (err) {
        statusEl.className = "message";
        statusEl.textContent = "Connection error.";
      } finally {
        btn.disabled = false;
        btn.textContent = "Verify Email";
      }
    });
  </script>
{% endblock %}
