{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}
{% block content %}
  <div class="card">
    <h1 id="reset-title">Reset Password</h1>
    <p class="message" id="reset-status" style="font-size: 0.95rem; margin: 12px 0;"></p>

    <form id="reset-password-form">
      <div id="token-input-group" class="hidden">
        <label>Reset Token</label>
        <input type="text" id="reset-token-input" placeholder="Paste reset token here">
      </div>

      <label>New Password</label>
      <input type="password" id="new-password" placeholder="New password (min 6 chars)" required minlength="6">

      <label>Confirm New Password</label>
      <input type="password" id="confirm-password" placeholder="Confirm new password" required minlength="6">

      <button type="submit" id="submit-btn" style="margin-top: 16px;">Update Password</button>
    </form>

    <p class="switch" style="margin-top: 20px;">
      <a href="/signin" id="signin-link">Back to Sign In</a>
    </p>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get("token") || urlParams.get("reset_token");
      const tokenGroup = document.getElementById("token-input-group");
      const statusEl = document.getElementById("reset-status");

      if (!token) {
        tokenGroup.classList.remove("hidden");
        document.getElementById("reset-token-input").required = true;
        statusEl.textContent = "Please enter your reset token and new password.";
      } else {
        document.getElementById("reset-token-input").value = token.trim();
        statusEl.textContent = "Enter your new password below.";
      }
    });

    document.getElementById("reset-password-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const statusEl = document.getElementById("reset-status");
      const btn = document.getElementById("submit-btn");
      const tokenInput = document.getElementById("reset-token-input").value.trim();
      const newPassword = document.getElementById("new-password").value;
      const confirmPassword = document.getElementById("confirm-password").value;

      if (newPassword !== confirmPassword) {
        statusEl.className = "message";
        statusEl.textContent = "Passwords do not match.";
        return;
      }

      if (!tokenInput) {
        statusEl.className = "message";
        statusEl.textContent = "Reset token is required.";
        return;
      }

      btn.disabled = true;
      btn.textContent = "Updating...";
      statusEl.textContent = "";

      try {
        const res = await fetch("/api/auth/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            reset_token: tokenInput,
            new_password: newPassword
          })
        });
        const data = await res.json();

        if (res.ok) {
          document.getElementById("reset-title").textContent = "Password Updated!";
          statusEl.className = "message success";
          statusEl.innerHTML = "Your password has been reset successfully! 🎉<br><br><a href='/signin' style='color: #60a5fa; font-weight: 500;'>Click here to Sign In</a>";
          document.getElementById("reset-password-form").classList.add("hidden");
        } else {
          statusEl.className = "message";
          statusEl.textContent = data.error || "Failed to reset password. Token may be invalid or expired.";
        }
      } catch (err) {
        statusEl.className = "message";
        statusEl.textContent = "Connection error. Please try again.";
      } finally {
        btn.disabled = false;
        btn.textContent = "Update Password";
      }
    });
  </script>
{% endblock %}
